<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed-variant": "#421cca",
              "surface-container": "#f0eded",
              "surface-container-low": "#f6f3f2",
              "inverse-primary": "#c6c6c6",
              "inverse-surface": "#303030",
              "on-surface-variant": "#4c4546",
              "primary-container": "#1b1b1b",
              "on-tertiary": "#ffffff",
              "tertiary-fixed-dim": "#c7c6c6",
              "on-primary-fixed-variant": "#474747",
              "surface-container-lowest": "#ffffff",
              "secondary": "#583cdf",
              "on-background": "#1b1c1c",
              "surface-dim": "#dcd9d9",
              "primary": "#000000",
              "on-primary-fixed": "#1b1b1b",
              "on-surface": "#1b1c1c",
              "on-error": "#ffffff",
              "inverse-on-surface": "#f3f0ef",
              "tertiary-container": "#1b1c1c",
              "secondary-fixed-dim": "#c8bfff",
              "surface-tint": "#5e5e5e",
              "surface-container-highest": "#e4e2e1",
              "on-tertiary-fixed-variant": "#464747",
              "primary-fixed": "#e2e2e2",
              "tertiary": "#000000",
              "error-container": "#ffdad6",
              "primary-fixed-dim": "#c6c6c6",
              "on-primary": "#ffffff",
              "on-secondary": "#ffffff",
              "secondary-fixed": "#e5deff",
              "on-tertiary-fixed": "#1b1c1c",
              "surface-variant": "#e4e2e1",
              "on-primary-container": "#848484",
              "on-error-container": "#93000a",
              "surface": "#fcf9f8",
              "outline": "#7e7576",
              "on-tertiary-container": "#848484",
              "on-secondary-fixed": "#190064",
              "tertiary-fixed": "#e3e2e2",
              "surface-container-high": "#eae7e7",
              "surface-bright": "#fcf9f8",
              "error": "#ba1a1a",
              "background": "#fcf9f8",
              "on-secondary-container": "#fffbff",
              "secondary-container": "#7259f9",
              "outline-variant": "#cfc4c5"
            },
            fontFamily: {
              "headline": ["Inter", "sans-serif"],
              "body": ["Inter", "sans-serif"],
              "label": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        @font-face {
            font-family: 'Cal Sans';
            src: url('https://fonts.cdnfonts.com/s/85257/CalSans-SemiBold.woff') format('woff');
        }
        .font-cal { font-family: 'Cal Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-white dark:bg-black flex justify-center items-center w-full py-8 px-6 docked full-width top-0">
<div class="flex items-center justify-center">
<span class="text-xl font-black text-black dark:text-white uppercase tracking-widest font-cal">AutoPlanner</span>
</div>
</header>
<!-- Main Content: Login Shell -->
<main class="flex-grow flex items-center justify-center px-6 py-12">
<div class="w-full max-w-[420px] bg-surface-container-lowest p-0 md:p-8">
<div class="text-center mb-10">
<h1 class="text-3xl font-cal text-primary tracking-tight mb-2">Log in to your account</h1>
<p class="text-on-surface-variant text-sm body-md">Enter your credentials to manage your schedules.</p>
</div>
<form class="space-y-5">
<div>
<label class="block text-[10px] uppercase tracking-widest font-bold text-on-surface-variant mb-2" for="email">Email Address</label>
<input class="w-full px-4 py-3 bg-surface-container-low border-0 focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 text-sm outline-none" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block text-[10px] uppercase tracking-widest font-bold text-on-surface-variant" for="password">Password</label>
<a class="text-[10px] uppercase tracking-widest font-bold text-secondary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<input class="w-full px-4 py-3 bg-surface-container-low border-0 focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 text-sm outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full bg-primary text-on-primary py-3.5 px-4 font-semibold text-sm tracking-tight hover:opacity-90 active:scale-[0.98] transition-all duration-200" type="submit">
                    Sign in
                </button>
</form>
<div class="relative my-10">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant opacity-20"></div>
</div>
<div class="relative flex justify-center text-[10px] uppercase tracking-widest font-bold">
<span class="bg-surface-container-lowest px-4 text-on-surface-variant">Or continue with</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 px-4 py-3 bg-white border border-outline-variant border-opacity-30 hover:bg-surface-container-low transition-colors text-sm font-medium">
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81.38z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
<button class="flex items-center justify-center gap-2 px-4 py-3 bg-white border border-outline-variant border-opacity-30 hover:bg-surface-container-low transition-colors text-sm font-medium">
<span class="material-symbols-outlined text-[18px]">key</span>
                    SAML
                </button>
</div>
<p class="mt-8 text-center text-xs text-on-surface-variant">
                Don't have an account? 
                <a class="font-bold text-primary hover:underline" href="#">Create an account</a>
</p>
</div>
</main>
<!-- Footer -->
<footer class="bg-white dark:bg-black flex justify-between items-center px-12 py-6 w-full fixed bottom-0">
<div class="text-[10px] uppercase tracking-widest font-medium text-gray-400 dark:text-gray-600">
            © 2024 AutoPlanner. Precision Utility.
        </div>
<div class="flex gap-8">
<a class="text-[10px] uppercase tracking-widest font-medium text-gray-400 dark:text-gray-600 hover:text-black dark:hover:text-white transition-all duration-300" href="#">Privacy</a>
<a class="text-[10px] uppercase tracking-widest font-medium text-gray-400 dark:text-gray-600 hover:text-black dark:hover:text-white transition-all duration-300" href="#">Terms</a>
<a class="text-[10px] uppercase tracking-widest font-medium text-gray-400 dark:text-gray-600 hover:text-black dark:hover:text-white transition-all duration-300" href="#">Support</a>
</div>
</footer>
</body></html>
