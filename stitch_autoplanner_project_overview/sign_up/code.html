<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up | AutoPlanner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @font-face {
            font-family: 'Cal Sans';
            src: url('https://fonts.cdnfonts.com/s/85487/CalSans-SemiBold.woff') format('woff');
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .font-headline { font-family: 'Cal Sans', sans-serif; }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-fixed-variant": "#421cca",
                        "surface-container": "#f0eded",
                        "surface-container-low": "#f6f3f2",
                        "inverse-primary": "#c6c6c6",
                        "inverse-surface": "#303030",
                        "on-surface-variant": "#4c4546",
                        "primary-container": "#1b1b1b",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#c7c6c6",
                        "on-primary-fixed-variant": "#474747",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#583cdf",
                        "on-background": "#1b1c1c",
                        "surface-dim": "#dcd9d9",
                        "primary": "#000000",
                        "on-primary-fixed": "#1b1b1b",
                        "on-surface": "#1b1c1c",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#f3f0ef",
                        "tertiary-container": "#1b1c1c",
                        "secondary-fixed-dim": "#c8bfff",
                        "surface-tint": "#5e5e5e",
                        "surface-container-highest": "#e4e2e1",
                        "on-tertiary-fixed-variant": "#464747",
                        "primary-fixed": "#e2e2e2",
                        "tertiary": "#000000",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#c6c6c6",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#e5deff",
                        "on-tertiary-fixed": "#1b1c1c",
                        "surface-variant": "#e4e2e1",
                        "on-primary-container": "#848484",
                        "on-error-container": "#93000a",
                        "surface": "#fcf9f8",
                        "outline": "#7e7576",
                        "on-tertiary-container": "#848484",
                        "on-secondary-fixed": "#190064",
                        "tertiary-fixed": "#e3e2e2",
                        "surface-container-high": "#eae7e7",
                        "surface-bright": "#fcf9f8",
                        "error": "#ba1a1a",
                        "background": "#fcf9f8",
                        "on-secondary-container": "#fffbff",
                        "secondary-container": "#7259f9",
                        "outline-variant": "#cfc4c5"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                },
            },
        }
    </script>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col selection:bg-secondary selection:text-white">
<!-- TopAppBar Shell (Suppressed Nav links for transactional page) -->
<header class="bg-white dark:bg-black flex justify-center items-center w-full py-8 px-6 fixed top-0 z-50">
<div class="w-full max-w-7xl flex justify-between items-center">
<span class="text-xl font-black text-black dark:text-white uppercase tracking-widest font-headline">AutoPlanner</span>
<div class="hidden md:block">
<a class="text-[10px] uppercase tracking-widest font-medium text-gray-400 hover:text-black transition-colors" href="#">Support</a>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center pt-24 pb-32 px-6">
<div class="w-full max-w-[420px] bg-white border border-outline-variant/10 p-10 rounded-xl shadow-[0_40px_80px_-20px_rgba(27,28,28,0.04)]">
<div class="mb-10 text-center">
<h1 class="font-headline text-4xl tracking-tight text-primary mb-3">Get started</h1>
<p class="text-on-surface-variant text-sm leading-relaxed">Precision utility for your scheduling workflow.</p>
</div>
<form class="space-y-6">
<!-- Field: Full Name -->
<div class="space-y-2">
<label class="block text-[10px] uppercase tracking-widest font-medium text-on-surface-variant" for="full_name">Full Name</label>
<input class="w-full px-4 py-3 bg-surface-container-low border-0 focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 text-sm text-on-surface placeholder:text-gray-400 rounded-md" id="full_name" name="full_name" placeholder="John Doe" type="text"/>
</div>
<!-- Field: Institution Email -->
<div class="space-y-2">
<label class="block text-[10px] uppercase tracking-widest font-medium text-on-surface-variant" for="email">Institution Email</label>
<input class="w-full px-4 py-3 bg-surface-container-low border-0 focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 text-sm text-on-surface placeholder:text-gray-400 rounded-md" id="email" name="email" placeholder="john@university.edu" type="email"/>
</div>
<!-- Field: Password -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block text-[10px] uppercase tracking-widest font-medium text-on-surface-variant" for="password">Password</label>
<span class="text-[10px] text-gray-400 uppercase tracking-widest">Min. 8 characters</span>
</div>
<input class="w-full px-4 py-3 bg-surface-container-low border-0 focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 text-sm text-on-surface placeholder:text-gray-400 rounded-md" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary py-4 rounded-md font-semibold text-sm hover:opacity-90 active:opacity-80 transition-all duration-200 mt-4 flex items-center justify-center gap-2" type="submit">
                    Create Account
                    <span class="material-symbols-outlined text-base" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-10 pt-8 border-t border-outline-variant/10 text-center">
<p class="text-sm text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:underline underline-offset-4 decoration-1" href="#">Sign in</a>
</p>
</div>
</div>
</main>
<!-- Footer Component -->
<footer class="bg-white dark:bg-black fixed bottom-0 w-full flex justify-between items-center px-12 py-6">
<div class="text-[10px] uppercase tracking-widest font-medium text-gray-400 dark:text-gray-600">
            © 2024 AutoPlanner. Precision Utility.
        </div>
<div class="flex gap-8">
<a class="text-[10px] uppercase tracking-widest font-medium text-gray-400 dark:text-gray-600 hover:text-black dark:hover:text-white transition-all duration-300" href="#">Privacy</a>
<a class="text-[10px] uppercase tracking-widest font-medium text-gray-400 dark:text-gray-600 hover:text-black dark:hover:text-white transition-all duration-300" href="#">Terms</a>
<a class="text-[10px] uppercase tracking-widest font-medium text-gray-400 dark:text-gray-600 hover:text-black dark:hover:text-white transition-all duration-300" href="#">Support</a>
</div>
</footer>
<!-- Decorative Aesthetic Element: Floating Glass Graphic -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 -z-10 w-[80vw] h-[819px] pointer-events-none opacity-40">
<div class="w-full h-full bg-gradient-to-br from-surface-container-low via-white to-surface-container-highest blur-3xl rounded-full"></div>
</div>
</body></html>
